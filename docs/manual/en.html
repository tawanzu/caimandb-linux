            // ================================================================
            //  24. HTTP API
            // ================================================================
            addSection('http-api', 'HTTP API Endpoints',
                '<p class="section-desc">RESTful HTTP API endpoints for query execution and administration.</p>' +
                '<h4>Query API (Port 1555)</h4>' +
                code(
                    '<span class="kw">GET</span>  /query?db=<span class="var">&lt;db&gt;</span>&query=<span class="var">&lt;command&gt;</span>\n' +
                    '<span class="kw">GET</span>  /status\n' +
                    '<span class="kw">GET</span>  /health'
                ) +
                '<h4>Admin API (Port 1556)</h4>' +
                code(
                    '<span class="kw">POST</span>   /api/v1/token           <span class="cmt">-- Generate JWT token (Basic Auth)</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/auth/login      <span class="cmt">-- Login (Basic Auth)</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/auth/logout     <span class="cmt">-- Logout</span>\n' +
                    '<span class="kw">GET</span>    /api/v1/health          <span class="cmt">-- Health check</span>\n' +
                    '<span class="kw">GET</span>    /api/v1/status          <span class="cmt">-- System status</span>\n' +
                    '<span class="kw">GET</span>    /api/v1/dbs             <span class="cmt">-- List databases</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/dbs             <span class="cmt">-- Create database</span>\n' +
                    '<span class="kw">GET</span>    /api/v1/db/{name}       <span class="cmt">-- Get database info</span>\n' +
                    '<span class="kw">DELETE</span> /api/v1/db/{name}       <span class="cmt">-- Delete database</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/query           <span class="cmt">-- Execute query</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/backup          <span class="cmt">-- Backup database</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/restore         <span class="cmt">-- Restore database</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/compact         <span class="cmt">-- Compact database</span>\n' +
                    '<span class="kw">GET</span>    /api/v1/users           <span class="cmt">-- List users</span>\n' +
                    '<span class="kw">POST</span>   /api/v1/users           <span class="cmt">-- Create user</span>\n' +
                    '<span class="kw">GET</span>    /metrics                <span class="cmt">-- Prometheus metrics</span>'
                ) +
                tip('Use the Admin API for automation and integration with external tools.') +
                note('All Admin API endpoints require authentication with JWT token or Basic Auth.')
            );

            // ================================================================
            //  25. FULL WORKED EXAMPLE
            // ================================================================
            addSection('full-example', 'Full Worked Example',
                '<p class="section-desc">A complete end-to-end example covering database creation, inserts, queries, updates, transactions, views, and exports.</p>' +
                code(
                    '<span class="kw">CREATE DB</span> shop\n' +
                    '<span class="kw">USE</span> shop\n' +
                    '<span class="kw">CREATE BLOCK</span> products\n' +
                    '\n' +
                    '<span class="kw">INSERT</span> products kb001 {<span class="str">"name"</span>: <span class="str">"Keyboard"</span>, <span class="str">"price"</span>: <span class="num">49.90</span>, <span class="str">"in_stock"</span>: <span class="bool">true</span>}\n' +
                    '<span class="kw">INSERT</span> products {<span class="str">"name"</span>: <span class="str">"Mouse"</span>, <span class="str">"price"</span>: <span class="num">19.90</span>, <span class="str">"in_stock"</span>: <span class="bool">true</span>}\n' +
                    '<span class="kw">INSERT</span> products name: <span class="str">"Monitor"</span>, price: <span class="num">199.00</span>, in_stock: <span class="bool">true</span>\n' +
                    '\n' +
                    '<span class="kw">FIND</span> products <span class="kw">WHERE</span> price > <span class="num">20</span>\n' +
                    '<span class="kw">FIND</span> products <span class="kw">WHERE</span> name <span class="kw">LIKE</span> <span class="str">"%oard%"</span> <span class="kw">ORDER</span> price:<span class="kw">DESC</span>\n' +
                    '<span class="kw">FIND</span> products <span class="kw">WHERE</span> price <span class="kw">BETWEEN</span> <span class="num">20</span> <span class="kw">AND</span> <span class="num">200</span> <span class="kw">SELECT</span> name, price\n' +
                    '\n' +
                    '<span class="kw">SEARCH</span> products <span class="str">"keyboard"</span> <span class="kw">WITH SCORE</span>\n' +
                    '\n' +
                    '<span class="kw">UPDATE</span> products <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span> <span class="kw">SET</span> price = <span class="num">45</span>\n' +
                    '<span class="kw">UPDATE</span> products <span class="kw">WHERE</span> price < <span class="num">30</span> <span class="kw">INC</span> price = <span class="num">1</span>\n' +
                    '\n' +
                    '<span class="kw">COUNT</span> products <span class="kw">WHERE</span> in_stock = <span class="bool">true</span>\n' +
                    '<span class="kw">AVG</span> products price\n' +
                    '<span class="kw">GROUP</span> products <span class="kw">BY</span> in_stock <span class="kw">COUNT</span>\n' +
                    '\n' +
                    '<span class="kw">DELETE</span> products <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span>\n' +
                    '\n' +
                    '<span class="kw">BEGIN</span> shop products\n' +
                    '  <span class="kw">INSERT</span> products {<span class="str">"name"</span>: <span class="str">"Webcam"</span>, <span class="str">"price"</span>: <span class="num">39.90</span>}\n' +
                    '  <span class="kw">UPDATE</span> products <span class="kw">WHERE</span> name = <span class="str">"Mouse"</span> <span class="kw">SET</span> price = <span class="num">17.90</span>\n' +
                    '<span class="kw">COMMIT</span>\n' +
                    '\n' +
                    '<span class="kw">VIEW CREATE</span> cheap_products <span class="kw">AS FIND</span> products <span class="kw">WHERE</span> price < <span class="num">25</span>\n' +
                    'cheap_products\n' +
                    '\n' +
                    '<span class="kw">EXPORT</span> products <span class="kw">TO</span> <span class="str">"products_backup"</span>\n' +
                    '<span class="kw">STATUS</span>\n' +
                    '<span class="kw">STATS DB</span> shop'
                ) +
                tip('This example demonstrates the most common operations — use it as a starting point for your own workflows.')
            );

            // ================================================================
            //  RENDER
            // ================================================================
            var sidebarNav = document.getElementById('indexContainer');
            var mainContent = document.getElementById('mainContent');
            var searchInput = document.getElementById('searchInput');
            var searchMsg = document.getElementById('search-message');

            function renderAll(filter) {
                filter = filter || '';
                var filterLower = filter.toLowerCase().trim();
                var ul = document.createElement('ul');
                var visibleCount = 0;

                for (var i = 0; i < sections.length; i++) {
                    var sec = sections[i];
                    var matches = filterLower === '' ||
                        sec.title.toLowerCase().indexOf(filterLower) !== -1 ||
                        sec.content.toLowerCase().indexOf(filterLower) !== -1;

                    if (filterLower !== '' && !matches) continue;
                    visibleCount++;

                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.innerHTML = '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span> ' + sec.title;
                    a.dataset.id = sec.id;
                    li.appendChild(a);
                    ul.appendChild(li);
                }

                sidebarNav.innerHTML = '';
                sidebarNav.appendChild(ul);

                searchMsg.style.display = (filterLower !== '' && visibleCount === 0) ? 'block' : 'none';

                var html = '';
                for (var i = 0; i < sections.length; i++) {
                    var sec = sections[i];
                    var match = filterLower === '' ||
                        sec.title.toLowerCase().indexOf(filterLower) !== -1 ||
                        sec.content.toLowerCase().indexOf(filterLower) !== -1;
                    if (filterLower !== '' && !match) continue;
                    html += '<h2 id="' + sec.id + '">' + String(i + 1).padStart(2, '0') + '. ' + sec.title + '</h2>' + sec.content;
                }
                mainContent.innerHTML = html;

                var links = sidebarNav.querySelectorAll('a');
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var id = entry.target.id;
                            links.forEach(function(a) {
                                if (a.dataset.id === id) {
                                    a.classList.add('active');
                                } else {
                                    a.classList.remove('active');
                                }
                            });
                        }
                    });
                }, { threshold: 0.25 });

                document.querySelectorAll('.main-content h2').forEach(function(h) { observer.observe(h); });
            }

            renderAll('');

            searchInput.addEventListener('input', function() {
                renderAll(this.value);
            });

            document.addEventListener('click', function(e) {
                var link = e.target.closest('a[href^="#"]');
                if (link) {
                    e.preventDefault();
                    var targetId = link.getAttribute('href').substring(1);
                    var targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth' });
                        document.querySelectorAll('.index-container a').forEach(function(a) {
                            if (a.dataset.id === targetId) {
                                a.classList.add('active');
                            } else {
                                a.classList.remove('active');
                            }
                        });
                    }
                }
            });

        })();
    </script>
