<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaimanDB NQL · Referencia Completa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f4f9;
            color: #0b1a2f;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            overflow: hidden;
            box-shadow: 2px 0 8px rgba(0,0,0,0.04);
        }

        .sidebar-header {
            padding: 1.25rem 1.25rem 0.5rem 1.25rem;
            border-bottom: 1px solid #eef2f6;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #0b1a2f;
        }
        .sidebar-header h1 span { color: #2563eb; }
        .sidebar-header .sub {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 400;
            margin-top: 2px;
        }

        .search-box {
            margin: 0.75rem 1.25rem 0.5rem 1.25rem;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 0.6rem 0.6rem 2.4rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.85rem;
            background: #f1f5f9;
            transition: all 0.15s;
            outline: none;
            font-family: inherit;
            color: #0b1a2f;
        }

        .search-box input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .search-box .icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .index-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0 2rem 0;
        }

        .index-container ul {
            list-style: none;
            padding: 0 0.5rem;
        }
        .index-container li { margin: 0.05rem 0; }

        .index-container a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            color: #1e293b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 450;
            transition: background 0.08s, color 0.08s;
            border-left: 3px solid transparent;
        }

        .index-container a .idx {
            font-size: 0.65rem;
            color: #94a3b8;
            font-weight: 400;
            min-width: 1.6rem;
            text-align: right;
        }

        .index-container a:hover {
            background: #eef2ff;
            color: #1e3a8a;
            border-left-color: #2563eb;
        }

        .index-container a.active {
            background: #dbeafe;
            border-left-color: #2563eb;
            color: #1e3a8a;
            font-weight: 500;
        }

        #search-message {
            font-size: 0.8rem;
            color: #64748b;
            padding: 0.2rem 1.25rem 0.5rem 1.25rem;
            display: none;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem 4rem 3rem;
            background: #f8fafc;
        }

        .main-content h2 {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 2rem 0 0.6rem 0;
            padding-bottom: 0.3rem;
            border-bottom: 3px solid #e2e8f0;
            letter-spacing: -0.02em;
            color: #0b1a2f;
            scroll-margin-top: 1.2rem;
        }
        .main-content h2:first-of-type { margin-top: 0; }

        .main-content h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 1.4rem 0 0.5rem 0;
            color: #0f2b4b;
        }

        .main-content h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 1rem 0 0.25rem 0;
            color: #1e3a5f;
        }

        .main-content p {
            line-height: 1.7;
            color: #1e293b;
            margin: 0.5rem 0;
        }

        .main-content li {
            line-height: 1.7;
            color: #1e293b;
        }

        .main-content ul {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .main-content ul li { margin: 0.2rem 0; }

        .main-content .code-block {
            background: #0d1b2a;
            color: #e2e8f0;
            padding: 1rem 1.4rem;
            border-radius: 12px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            margin: 0.7rem 0 1.2rem 0;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #1e293b;
            line-height: 1.8;
        }

        .main-content .code-block .kw { color: #f472b6; font-weight: 600; }
        .main-content .code-block .fn { color: #60a5fa; }
        .main-content .code-block .str { color: #a7f3d0; }
        .main-content .code-block .cmt { color: #64748b; font-style: italic; }
        .main-content .code-block .num { color: #fcd34d; }
        .main-content .code-block .op { color: #c084fc; }
        .main-content .code-block .bool { color: #f472b6; }
        .main-content .code-block .var { color: #93c5fd; }
        .main-content .code-block .type { color: #6ee7b7; }
        .main-content .code-block .err { color: #fca5a5; }

        .main-content .inline-code {
            background: #eef2f6;
            padding: 0.15rem 0.5rem;
            border-radius: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #0b1a2f;
            border: 1px solid #dbe0e8;
        }

        .main-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0 1.8rem 0;
            font-size: 0.9rem;
        }

        .main-content th {
            background: #eef2f6;
            text-align: left;
            padding: 0.6rem 0.9rem;
            font-weight: 600;
            border: 1px solid #d1d9e6;
        }

        .main-content td {
            padding: 0.6rem 0.9rem;
            border: 1px solid #d1d9e6;
            background: white;
        }

        .main-content .note {
            background: #fefce8;
            border-left: 4px solid #eab308;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            margin: 0.8rem 0;
            font-size: 0.92rem;
        }
        .main-content .note strong { color: #854d0e; }

        .main-content .tip {
            background: #ecfdf5;
            border-left: 4px solid #10b981;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            margin: 0.8rem 0;
            font-size: 0.92rem;
        }
        .main-content .tip strong { color: #065f46; }

        .main-content .warning {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            margin: 0.8rem 0;
            font-size: 0.92rem;
        }
        .main-content .warning strong { color: #991b1b; }

        .main-content .info {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            margin: 0.8rem 0;
            font-size: 0.92rem;
        }
        .main-content .info strong { color: #1e40af; }

        .main-content hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #e2e8f0, transparent);
            margin: 2.5rem 0;
        }

        .main-content .cmd-syntax {
            background: #f1f5f9;
            padding: 0.15rem 0.6rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #0b1a2f;
            border: 1px solid #e2e8f0;
        }

        .main-content .section-desc {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .main-content .tree {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #1e293b;
            background: #f1f5f9;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin: 0.5rem 0;
            border: 1px solid #e2e8f0;
            line-height: 1.8;
        }

        .main-content::-webkit-scrollbar,
        .index-container::-webkit-scrollbar {
            width: 5px;
        }

        .main-content::-webkit-scrollbar-track,
        .index-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb,
        .index-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .main-content::-webkit-scrollbar-thumb:hover,
        .index-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (max-width: 768px) {
            .sidebar { width: 260px; }
            .main-content { padding: 1.5rem; }
        }

        @media (max-width: 600px) {
            body { flex-direction: column; height: auto; overflow: visible; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #e2e8f0; }
            .index-container { max-height: 300px; }
            .main-content { height: auto; overflow: visible; padding: 1.25rem; }
        }

        .main-content * {
            scroll-margin-top: 1.2rem;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>CaimanDB <span>NQL</span></h1>
            <div class="sub">Referencia Completa de Sintaxis · v1.0</div>
        </div>
        <div class="search-box">
            <span class="icon">⌕</span>
            <input type="text" id="searchInput" placeholder="Buscar comandos, palabras clave..." aria-label="Buscar sintaxis">
        </div>
        <div id="search-message">No se encontraron resultados</div>
        <nav class="index-container" id="indexContainer"></nav>
    </aside>

    <main class="main-content" id="mainContent"></main>

    <script>
        (function() {
            const sections = [];

            function addSection(id, title, contentHtml) {
                sections.push({ id, title, content: contentHtml });
            }

            function code(str) {
                return '<div class="code-block">' + str + '</div>';
            }

            function inline(str) {
                return '<span class="inline-code">' + str + '</span>';
            }

            function note(txt) {
                return '<div class="note"><strong>Nota:</strong> ' + txt + '</div>';
            }

            function tip(txt) {
                return '<div class="tip"><strong>Consejo:</strong> ' + txt + '</div>';
            }

            function warning(txt) {
                return '<div class="warning"><strong>Advertencia:</strong> ' + txt + '</div>';
            }

            function info(txt) {
                return '<div class="info"><strong>Información:</strong> ' + txt + '</div>';
            }

            function table(rows, headers) {
                var h = headers ? '<thead><tr>' + headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead>' : '';
                var b = rows.map(function(r) { return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('');
                return '<table>' + h + '<tbody>' + b + '</tbody></table>';
            }

            // ================================================================
            //  ESTRUCTURA DE DIRECTORIOS
            // ================================================================
            addSection('directory-structure', 'Estructura de Directorios',
                '<p class="section-desc">Organización en disco de CaimanDB para bases de datos, bloques, índices y datos del sistema.</p>' +
                '<div class="tree">' +
                './data/<br/>' +
                '├── &lt;db_name&gt;/                    <span class="cmt">← Directorio de la base de datos</span><br/>' +
                '│   ├── __meta/                   <span class="cmt">← Metadatos de la base de datos (db.json)</span><br/>' +
                '│   ├── &lt;block_name&gt;/             <span class="cmt">← Directorio del bloque</span><br/>' +
                '│   │   ├── __data/               <span class="cmt">← Datos de BadgerDB (documentos)</span><br/>' +
                '│   │   ├── __index/              <span class="cmt">← Índices secundarios</span><br/>' +
                '│   │   └── __meta/               <span class="cmt">← Metadatos del bloque (block.json)</span><br/>' +
                '│   └── ... más bloques<br/>' +
                '├── __users/                      <span class="cmt">← Autenticación de usuarios (Argon2id)</span><br/>' +
                '├── __raft/                       <span class="cmt">← Estado del clúster Raft</span><br/>' +
                '├── __shards/                     <span class="cmt">← Datos de gestión de fragmentos</span><br/>' +
                '├── __cluster/                    <span class="cmt">← Información de nodos del clúster</span><br/>' +
                '├── __system/                     <span class="cmt">← Datos del sistema</span><br/>' +
                '│   └── wal/                      <span class="cmt">← Write-Ahead Log (WAL)</span><br/>' +
                '└── __external/                   <span class="cmt">← Almacenamiento externo para documentos grandes (>5MB)</span>' +
                '</div>' +
                info('Todos los metadatos de bases de datos y bloques se almacenan como archivos JSON en los directorios __meta.') +
                note('Los documentos grandes que excedan 5 MB se almacenan automáticamente en __external/ para optimizar el rendimiento de BadgerDB.')
            );

            // ================================================================
            //  CARACTERÍSTICAS AVANZADAS
            // ================================================================
            addSection('advanced-features', 'Características Avanzadas',
                '<p class="section-desc">Funcionalidades de nivel empresarial de CaimanDB para seguridad, rendimiento y escalabilidad.</p>' +
                '<h4>Seguridad</h4>' +
                '<ul>' +
                '<li><strong>Hashing de contraseñas Argon2id</strong> (recomendado por OWASP)</li>' +
                '<li><strong>Autenticación JWT</strong> con caducidad configurable</li>' +
                '<li><strong>Autenticación básica</strong> como alternativa (HTTP)</li>' +
                '<li><strong>Límite de tasa</strong> por usuario (configurable)</li>' +
                '<li><strong>Bloqueo de cuenta</strong> tras intentos fallidos</li>' +
                '<li><strong>Registro de auditoría</strong> (formato JSON)</li>' +
                '<li><strong>Soporte TLS/HTTPS</strong></li>' +
                '<li><strong>Motor de riesgos</strong> para bloqueo de operaciones</li>' +
                '</ul>' +
                '<h4>Gestión de Datos</h4>' +
                '<ul>' +
                '<li><strong>Transacciones ACID</strong> (BEGIN/COMMIT/ROLLBACK)</li>' +
                '<li><strong>Write-Ahead Logging</strong> (WAL) para recuperación ante caídas</li>' +
                '<li><strong>Almacenamiento externo</strong> para documentos grandes (>5MB)</li>' +
                '<li><strong>Compresión automática</strong> (Zstd/Gzip) para >100KB</li>' +
                '<li><strong>Índices secundarios</strong> con carga perezosa</li>' +
                '<li><strong>Almacenamiento en caché multinivel</strong> (L1 + L2)</li>' +
                '<li><strong>Hashing consistente</strong> para fragmentación</li>' +
                '<li><strong>División/fusión automática de fragmentos</strong></li>' +
                '<li><strong>Autoescalado</strong> basado en el crecimiento de datos</li>' +
                '</ul>' +
                '<h4>Rendimiento</h4>' +
                '<ul>' +
                '<li><strong>Optimizador de consultas basado en costos</strong></li>' +
                '<li><strong>Procesamiento vectorizado de consultas</strong></li>' +
                '<li><strong>Ejecución distribuida de consultas</strong></li>' +
                '<li><strong>Agrupación de búferes</strong> para reducir la presión del GC</li>' +
                '<li><strong>Soporte de WAL en streaming</strong></li>' +
                '<li><strong>Modo de inicio rápido</strong> (omitir reproducción WAL)</li>' +
                '<li><strong>Operaciones por lotes en paralelo</strong></li>' +
                '<li><strong>Carga perezosa de índices</strong> bajo demanda</li>' +
                '</ul>' +
                '<h4>Clúster</h4>' +
                '<ul>' +
                '<li><strong>Inicialización automática del clúster</strong> (consenso Raft)</li>' +
                '<li><strong>Descubrimiento automático de nodos</strong> y unión</li>' +
                '<li><strong>Reequilibrio automático</strong> con análisis predictivo</li>' +
                '<li><strong>Conmutación por error automática</strong> y elección de líder</li>' +
                '<li><strong>Ejecutor distribuido de consultas</strong> con poda de fragmentos</li>' +
                '<li><strong>Autoescalado</strong> a millones de nodos y fragmentos</li>' +
                '</ul>' +
                '<h4>Motor Inteligente</h4>' +
                '<ul>' +
                '<li><strong>Escalado predictivo</strong> (aprendizaje automático)</li>' +
                '<li><strong>Optimización automática de índices</strong></li>' +
                '<li><strong>Adaptación automática de caché</strong></li>' +
                '<li><strong>Autocuración</strong> con tiempo de inactividad cero</li>' +
                '<li><strong>Asignación predictiva de recursos</strong></li>' +
                '<li><strong>Enrutamiento inteligente de consultas</strong></li>' +
                '</ul>'
            );

            // ================================================================
            //  1. COMANDOS DE BASE DE DATOS
            // ================================================================
            addSection('database-commands', 'Comandos de Base de Datos',
                '<p class="section-desc">Crear, eliminar, renombrar, cambiar, inspeccionar, respaldar y restaurar bases de datos.</p>' +
                code(
                    '<span class="kw">CREATE DB</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">DROP DB</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">RENAME DB</span> <span class="var">&lt;antiguo&gt;</span> <span class="kw">TO</span> <span class="var">&lt;nuevo&gt;</span>\n' +
                    '<span class="kw">USE</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">SHOW DBS</span>\n' +
                    '<span class="kw">SHOW DBS</span> <span class="var">&lt;nombre&gt;</span> [<span class="var">&lt;nombre2&gt;</span> ...]\n' +
                    '<span class="kw">INFO DB</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">DESCRIBE DB</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">STATS DB</span> [<span class="var">&lt;nombre&gt;</span>]\n' +
                    '<span class="kw">SIZE DB</span> [<span class="var">&lt;nombre&gt;</span>]\n' +
                    '<span class="kw">COMPACT</span> <span class="var">&lt;db&gt;</span>\n' +
                    '<span class="kw">ANALYZE DB</span> [<span class="var">&lt;nombre&gt;</span>]\n' +
                    '<span class="kw">OPTIMIZE DB</span> [<span class="var">&lt;nombre&gt;</span>]\n' +
                    '<span class="kw">BACKUP</span> <span class="var">&lt;db&gt;</span> <span class="kw">TO</span> <span class="str">&lt;archivo&gt;</span>\n' +
                    '<span class="kw">RESTORE</span> <span class="var">&lt;db&gt;</span> <span class="kw">FROM</span> <span class="str">&lt;archivo&gt;</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">CREATE DB</span> tienda\n' +
                    '<span class="kw">USE</span> tienda\n' +
                    '<span class="kw">SHOW DBS</span>\n' +
                    '<span class="kw">INFO DB</span> tienda\n' +
                    '<span class="kw">STATS DB</span> tienda\n' +
                    '<span class="kw">BACKUP</span> tienda <span class="kw">TO</span> <span class="str">"tienda_2026.bak"</span>\n' +
                    '<span class="kw">RESTORE</span> tienda <span class="kw">FROM</span> <span class="str">"tienda_2026.bak"</span>\n' +
                    '<span class="kw">DROP DB</span> tienda_vieja'
                ) +
                '<ul>' +
                '<li><span class="inline-code">CREATE DB</span> crea una nueva base de datos vacía.</li>' +
                '<li><span class="inline-code">DROP DB</span> elimina permanentemente la base de datos y todos sus bloques.</li>' +
                '<li><span class="inline-code">COMPACT</span> ejecuta la recolección de basura y recupera espacio en disco.</li>' +
                '<li><span class="inline-code">BACKUP</span> crea una copia de seguridad completa de la base de datos.</li>' +
                '</ul>' +
                tip('Utilice <span class="inline-code">SHOW DBS</span> regularmente para supervisar el tamaño y crecimiento de las bases de datos.') +
                note('Los archivos de respaldo se almacenan en el directorio de respaldo configurado, típicamente junto a la raíz de datos.')
            );

            // ================================================================
            //  2. COMANDOS DE BLOQUES
            // ================================================================
            addSection('block-commands', 'Comandos de Bloques',
                '<p class="section-desc">Los bloques son contenedores (como tablas o colecciones) que almacenan documentos. Crear, eliminar, renombrar y gestionar bloques.</p>' +
                code(
                    '<span class="kw">CREATE BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">CREATE BLOCK</span> [<span class="var">&lt;db&gt;</span>] (<span class="var">&lt;n1&gt;</span>, <span class="var">&lt;n2&gt;</span>, ...)\n' +
                    '<span class="kw">DROP BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">RENAME BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;antiguo&gt;</span> <span class="kw">TO</span> <span class="var">&lt;nuevo&gt;</span>\n' +
                    '<span class="kw">RENAME BLOCK</span> [<span class="var">&lt;db&gt;</span>] (<span class="var">&lt;o1&gt;</span>,...) <span class="kw">TO</span> (<span class="var">&lt;n1&gt;</span>,...)\n' +
                    '<span class="kw">RENAME FIELD</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;block&gt;</span>.<span class="var">&lt;campo&gt;</span> <span class="kw">TO</span> <span class="var">&lt;nuevo_campo&gt;</span>\n' +
                    '<span class="kw">SHOW BLOCKS</span> [<span class="var">&lt;db&gt;</span>]\n' +
                    '<span class="kw">SHOW BLOCKS</span> <span class="var">&lt;db&gt;</span> <span class="var">&lt;nombre&gt;</span> [<span class="var">&lt;nombre2&gt;</span>]\n' +
                    '<span class="kw">INFO BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">DESCRIBE BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">EMPTY BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">CLEAR</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">ANALYZE BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">OPTIMIZE BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">REBUILD BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">CHECK BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">REPAIR BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">SIZE BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">CREATE BLOCK</span> productos\n' +
                    '<span class="kw">CREATE BLOCK</span> (productos, clientes, pedidos)\n' +
                    '<span class="kw">SHOW BLOCKS</span>\n' +
                    '<span class="kw">DESCRIBE BLOCK</span> productos\n' +
                    '<span class="kw">REBUILD BLOCK</span> productos\n' +
                    '<span class="kw">EMPTY BLOCK</span> productos\n' +
                    '<span class="kw">RENAME BLOCK</span> productos <span class="kw">TO</span> inventario\n' +
                    '<span class="kw">RENAME BLOCK</span> (producto, cliente) <span class="kw">TO</span> (productos, clientes)\n' +
                    '<span class="kw">RENAME FIELD</span> producto.nombre <span class="kw">TO</span> nombre_producto'
                ) +
                '<ul>' +
                '<li><span class="inline-code">CREATE BLOCK</span> crea un nuevo bloque en la base de datos actual o especificada.</li>' +
                '<li><span class="inline-code">CREATE BLOCK (a, b, c)</span> crea múltiples bloques en una sola declaración.</li>' +
                '<li><span class="inline-code">RENAME BLOCK</span> con listas renombra bloques por posición (las listas antigua y nueva deben coincidir).</li>' +
                '<li><span class="inline-code">RENAME FIELD</span> renombra un campo en todos los documentos de un bloque.</li>' +
                '<li><span class="inline-code">REBUILD BLOCK</span> reconstruye todos los índices de un bloque.</li>' +
                '</ul>' +
                note('Los bloques no tienen esquema fijo: la estructura surge de los documentos que contienen.') +
                warning('RENAME FIELD es una operación de reescritura masiva que lee y reescribe todos los documentos del bloque.')
            );

            // ================================================================
            //  3. INSERT
            // ================================================================
            addSection('insert', 'INSERT — Todas las Variantes',
                '<p class="section-desc">Insertar documentos usando JSON, clave-valor, por lotes, importación desde archivo o generación sintética.</p>' +
                code(
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> [<span class="var">&lt;id&gt;</span>] <span class="var">&lt;objeto-json&gt;</span>\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> [<span class="var">&lt;id&gt;</span>] <span class="var">clave</span>: <span class="var">valor</span>, <span class="var">clave2</span>: <span class="var">valor2</span>, ...\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> [<span class="var">&lt;id&gt;</span>] <span class="var">clave</span> = <span class="var">valor</span>, <span class="var">clave2</span> = <span class="var">valor2</span>, ...\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;doc1&gt;</span>; <span class="var">&lt;doc2&gt;</span>; <span class="var">&lt;doc3&gt;</span>; ...\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> [<span class="var">&lt;array-json&gt;</span>]\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">FROM</span> <span class="str">"&lt;archivo.json|archivo.csv&gt;"</span>\n' +
                    '<span class="kw">INSERT</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">GENERATE</span> <span class="var">&lt;n&gt;</span> [<span class="kw">WORKERS</span> <span class="var">&lt;w&gt;</span>]'
                ) +
                '<h4>Documento JSON</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos {<span class="str">"nombre"</span>: <span class="str">"Teclado"</span>, <span class="str">"precio"</span>: <span class="num">49.90</span>, <span class="str">"en_stock"</span>: <span class="bool">true</span>}'
                ) +
                '<h4>Con ID Explícito</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos kb001 {<span class="str">"nombre"</span>: <span class="str">"Teclado"</span>, <span class="str">"precio"</span>: <span class="num">49.90</span>, <span class="str">"en_stock"</span>: <span class="bool">true</span>}'
                ) +
                '<h4>Formato Clave:Valor</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos nombre: <span class="str">"Ratón"</span>, precio: <span class="num">19.90</span>, en_stock: <span class="bool">true</span>'
                ) +
                '<p>Los valores se tipifican automáticamente: los números se convierten en números, <span class="inline-code">{...}</span> en objetos anidados y el resto en cadenas recortadas.</p>' +
                '<h4>Múltiples Documentos</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos {<span class="str">"nombre"</span>: <span class="str">"A"</span>}; {<span class="str">"nombre"</span>: <span class="str">"B"</span>}; {<span class="str">"nombre"</span>: <span class="str">"C"</span>}'
                ) +
                '<h4>Inserción por Lotes (Array JSON)</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos [{<span class="str">"nombre"</span>: <span class="str">"A"</span>}, {<span class="str">"nombre"</span>: <span class="str">"B"</span>}, {<span class="str">"nombre"</span>: <span class="str">"C"</span>}]'
                ) +
                '<h4>Importar desde Archivo</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos <span class="kw">FROM</span> <span class="str">"productos.json"</span>\n' +
                    '<span class="kw">INSERT</span> productos <span class="kw">FROM</span> <span class="str">"productos.csv"</span>'
                ) +
                '<h4>GENERATE Datos Sintéticos</h4>' +
                code(
                    '<span class="kw">INSERT</span> productos <span class="kw">GENERATE</span> <span class="num">1000000</span>              <span class="cmt">-- trabajadores autoescalados</span>\n' +
                    '<span class="kw">INSERT</span> productos <span class="kw">GENERATE</span> <span class="num">200000</span> <span class="kw">WORKERS</span> <span class="num">8</span>     <span class="cmt">-- número fijo de trabajadores</span>'
                ) +
                tip('Utilice <span class="inline-code">GENERATE</span> para pruebas de rendimiento, pruebas de carga o siembra de bases de datos de desarrollo.') +
                note('Las ejecuciones grandes de GENERATE cambian automáticamente a MODO BULK.')
            );

            // ================================================================
            //  4. FIND / GET
            // ================================================================
            addSection('find-get', 'FIND / GET — Consultas',
                '<p class="section-desc">Consultar documentos con filtrado, proyección, agrupamiento, ordenamiento y paginación.</p>' +
                code(
                    '<span class="kw">FIND</span> <span class="var">&lt;bloque&gt;</span> [<span class="kw">SELECT</span> <span class="var">&lt;campo&gt;</span>[,<span class="var">&lt;campo&gt;</span>...] | <span class="var">&lt;campo&gt;</span> <span class="kw">AS</span> <span class="var">&lt;alias&gt;</span> | <span class="fn">COUNT</span>(<span class="var">&lt;campo&gt;</span>) <span class="kw">AS</span> <span class="var">&lt;alias&gt;</span> | <span class="var">&lt;campo&gt;</span>/<span class="var">&lt;n&gt;</span> <span class="kw">AS</span> <span class="var">&lt;alias&gt;</span>]\n' +
                    '                     [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '                     [<span class="kw">DISTINCT</span> [<span class="var">&lt;campo&gt;</span>[,<span class="var">&lt;campo&gt;</span>...]]]\n' +
                    '                     [<span class="kw">GROUP BY</span> <span class="var">&lt;campo&gt;</span>[,<span class="var">&lt;campo&gt;</span>...]] [<span class="kw">HAVING</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '                     [<span class="kw">ORDER</span> <span class="var">&lt;campo&gt;</span>[:<span class="kw">ASC</span>|<span class="kw">DESC</span>][,<span class="var">&lt;campo&gt;</span>...]]\n' +
                    '                     [<span class="kw">LIMIT</span> <span class="var">&lt;n&gt;</span>] [<span class="kw">OFFSET</span> <span class="var">&lt;n&gt;</span>]\n' +
                    '                     [--<span class="type">type:table</span>]\n' +
                    '\n' +
                    '<span class="kw">GET</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;id&gt;</span>\n' +
                    '<span class="kw">GET</span> <span class="var">&lt;bloque&gt;</span> @ <span class="var">&lt;id&gt;</span>\n' +
                    '\n' +
                    '<span class="kw">EXPLAIN FIND</span> ...     <span class="cmt">-- ejecuta la consulta en tiempo real e informa lo que sucedió</span>\n' +
                    '<span class="kw">EXPLAIN SEARCH</span> ...   <span class="cmt">-- como EXPLAIN ANALYZE</span>'
                ) +
                '<h4>Búsqueda Básica / Por ID</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> _id = <span class="str">"abc123"</span>\n' +
                    '<span class="kw">GET</span> productos abc123'
                ) +
                '<h4>Filtros</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> precio > <span class="num">20</span> <span class="kw">AND</span> en_stock = <span class="bool">true</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> nombre <span class="kw">LIKE</span> <span class="str">"%tecl%"</span> <span class="kw">OR</span> nombre <span class="kw">CONTAINS</span> <span class="str">"Mon"</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> precio <span class="kw">BETWEEN</span> <span class="num">10</span> <span class="kw">AND</span> <span class="num">100</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> estado <span class="kw">IN</span> (<span class="str">"activo"</span>, <span class="str">"pendiente"</span>)'
                ) +
                '<h4>Agrupamiento con Paréntesis y NOT</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> (estado = <span class="str">"activo"</span> <span class="kw">OR</span> estado = <span class="str">"prueba"</span>) <span class="kw">AND</span> precio >= <span class="num">18</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> <span class="kw">NOT</span> (estado = <span class="str">"bloqueado"</span> <span class="kw">OR</span> estado = <span class="str">"suspendido"</span>)'
                ) +
                '<h4>Proyección (SELECT)</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">SELECT</span> nombre, precio <span class="kw">WHERE</span> precio > <span class="num">20</span>'
                ) +
                '<h4>Campos SELECT Calculados</h4>' +
                code(
                    '<span class="kw">FIND</span> peliculas <span class="kw">SELECT</span> titulo, <span class="fn">COUNT</span>(actores) <span class="kw">as</span> num_actores, año\n' +
                    '<span class="kw">FIND</span> peliculas <span class="kw">SELECT</span> titulo, duracion_minutos / <span class="num">60</span> <span class="kw">as</span> horas'
                ) +
                '<h4>GROUP BY / HAVING</h4>' +
                code(
                    '<span class="kw">FIND</span> peliculas <span class="kw">SELECT</span> titulo, <span class="fn">COUNT</span>(actores) <span class="kw">as</span> num_actores, año\n' +
                    '          <span class="kw">WHERE</span> año >= <span class="num">2000</span>\n' +
                    '          <span class="kw">GROUP BY</span> titulo, año\n' +
                    '          <span class="kw">HAVING</span> <span class="fn">COUNT</span>(actores) >= <span class="num">5</span>'
                ) +
                '<h4>DISTINCT</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">DISTINCT</span>                    <span class="cmt">-- desduplicar toda la fila</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">DISTINCT</span> categoria           <span class="cmt">-- desduplicar por un campo</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">DISTINCT</span> categoria, estado   <span class="cmt">-- desduplicar por combinación</span>'
                ) +
                '<h4>Ordenamiento y Paginación</h4>' +
                code(
                    '<span class="kw">FIND</span> productos <span class="kw">ORDER</span> nombre, precio:<span class="kw">DESC</span> <span class="kw">WHERE</span> precio > <span class="num">18</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> precio > <span class="num">18</span> <span class="kw">LIMIT</span> <span class="num">50</span> <span class="kw">OFFSET</span> <span class="num">100</span>\n' +
                    '<span class="kw">FIND</span> productos <span class="kw">WHERE</span> precio > <span class="num">18</span> --<span class="type">type:table</span>'
                ) +
                tip('Utilice <span class="inline-code">EXPLAIN</span> para comprender el rendimiento de la consulta y el uso de índices.') +
                note('GROUP BY y HAVING son compatibles en consultas FIND para agregación en tiempo de consulta.')
            );

            // ================================================================
            //  5. SEARCH
            // ================================================================
            addSection('search', 'SEARCH — Texto Completo',
                '<p class="section-desc">Búsqueda de texto completo con coincidencia exacta, difusa, puntuación y resaltado.</p>' +
                code(
                    '<span class="kw">SEARCH</span> <span class="var">&lt;bloque&gt;</span> <span class="str">"&lt;texto&gt;"</span> [<span class="kw">EXACT</span> | <span class="kw">FUZZY</span>]\n' +
                    '                         [<span class="kw">WITH SCORE</span>] [<span class="kw">WITH MATCHES</span>]\n' +
                    '                         [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>] [<span class="kw">LIMIT</span> <span class="var">&lt;n&gt;</span>] [<span class="kw">ORDER</span> <span class="var">&lt;campo&gt;</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">SEARCH</span> productos <span class="str">"teclado inalámbrico"</span>\n' +
                    '<span class="kw">SEARCH</span> productos <span class="str">"frase exacta"</span> <span class="kw">EXACT</span>\n' +
                    '<span class="kw">SEARCH</span> productos <span class="str">"~teclado"</span> <span class="kw">FUZZY</span>\n' +
                    '<span class="kw">SEARCH</span> productos <span class="str">"teclado"</span> <span class="kw">WITH SCORE</span> <span class="kw">WITH MATCHES</span>\n' +
                    '<span class="kw">SEARCH</span> productos <span class="str">"+debe_incluir -debe_excluir opcional"</span>\n' +
                    '<span class="kw">SEARCH</span> productos <span class="str">"teclado"</span> <span class="kw">WHERE</span> precio > <span class="num">18</span> <span class="kw">LIMIT</span> <span class="num">50</span> <span class="kw">ORDER</span> nombre'
                ) +
                tip('Para bloques grandes, considere usar <span class="inline-code">LIMIT</span> para controlar el tamaño de los resultados.')
            );

            // ================================================================
            //  6. UPDATE
            // ================================================================
            addSection('update', 'UPDATE',
                '<p class="section-desc">Actualizar documentos con reemplazos de campos, incrementos/decrementos numéricos y modificaciones de arrays.</p>' +
                code(
                    '<span class="kw">UPDATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span> <span class="kw">SET</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;valor&gt;</span>[, <span class="var">&lt;campo2&gt;</span> = <span class="var">&lt;valor2&gt;</span> ...]\n' +
                    '<span class="kw">UPDATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span> <span class="kw">INC</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;n&gt;</span>\n' +
                    '<span class="kw">UPDATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span> <span class="kw">DEC</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;n&gt;</span>\n' +
                    '<span class="kw">UPDATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span> <span class="kw">PUSH</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;valor&gt;</span>\n' +
                    '<span class="kw">UPDATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span> <span class="kw">PULL</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;valor&gt;</span>\n' +
                    '<span class="kw">UPDATE ALL</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">SET</span> <span class="var">&lt;campo&gt;</span> = <span class="var">&lt;valor&gt;</span>[, ...]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">UPDATE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span> <span class="kw">SET</span> nombre = <span class="str">"Teclado Mecánico"</span>, precio = <span class="num">55</span>\n' +
                    '<span class="kw">UPDATE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span> <span class="kw">INC</span> vistas = <span class="num">1</span>\n' +
                    '<span class="kw">UPDATE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span> <span class="kw">PUSH</span> etiquetas = <span class="str">"ofertas"</span>\n' +
                    '<span class="kw">UPDATE ALL</span> productos <span class="kw">SET</span> estado = <span class="str">"archivado"</span>\n' +
                    '<span class="kw">UPDATE</span> productos <span class="kw">WHERE</span> estado = <span class="str">"borrador"</span> <span class="kw">SET</span> estado = <span class="str">"publicado"</span>, publicado_en = <span class="fn">now</span>()'
                ) +
                warning('UPDATE ALL puede ser costoso en bloques grandes — utilícelo con precaución.')
            );

            // ================================================================
            //  7. DELETE
            // ================================================================
            addSection('delete', 'DELETE',
                '<p class="section-desc">Eliminar documentos de un bloque según condiciones, o eliminar todos los documentos.</p>' +
                code(
                    '<span class="kw">DELETE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>\n' +
                    '<span class="kw">DELETE ALL</span> <span class="var">&lt;bloque&gt;</span>\n' +
                    '<span class="kw">EMPTY BLOCK</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>     <span class="cmt">-- alias para DELETE ALL</span>\n' +
                    '<span class="kw">CLEAR</span> [<span class="var">&lt;db&gt;</span>] <span class="var">&lt;nombre&gt;</span>           <span class="cmt">-- alias para DELETE ALL</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">DELETE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span>\n' +
                    '<span class="kw">DELETE</span> productos <span class="kw">WHERE</span> precio < <span class="num">5</span> <span class="kw">OR</span> en_stock = <span class="bool">false</span>\n' +
                    '<span class="kw">DELETE ALL</span> productos'
                ) +
                warning('Las operaciones DELETE son permanentes y no se pueden deshacer.')
            );

            // ================================================================
            //  8. ADD FIELD / DROP FIELD / TRUNCATE / UPSERT
            // ================================================================
            addSection('add-drop-truncate-upsert', 'ADD FIELD / DROP FIELD / TRUNCATE / UPSERT',
                '<p class="section-desc">Evolución del esquema: agregar campos con valores predeterminados, eliminar campos, truncar bloques y actualizar o insertar documentos.</p>' +
                code(
                    '<span class="kw">ADD FIELD</span> <span class="var">&lt;bloque&gt;</span>.<span class="var">&lt;campo&gt;</span> <span class="kw">DEFAULT</span> <span class="var">&lt;valor&gt;</span>[, <span class="var">&lt;campo2&gt;</span> <span class="kw">DEFAULT</span> <span class="var">&lt;valor2&gt;</span> ...]\n' +
                    '<span class="kw">DROP FIELD</span> <span class="var">&lt;bloque&gt;</span>.<span class="var">&lt;campo&gt;</span>[, <span class="var">&lt;campo2&gt;</span> ...] [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">TRUNCATE</span> <span class="var">&lt;bloque&gt;</span>\n' +
                    '<span class="kw">UPSERT</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;id&gt;</span> <span class="kw">SET</span> <span class="var">&lt;campo&gt;</span>=<span class="var">&lt;valor&gt;</span>[, <span class="var">&lt;campo2&gt;</span>=<span class="var">&lt;valor2&gt;</span> ...]\n' +
                    '<span class="kw">UPSERT</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;id&gt;</span> <span class="var">&lt;objeto-json&gt;</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">ADD FIELD</span> productos.descuento <span class="kw">DEFAULT</span> <span class="num">0</span>\n' +
                    '<span class="kw">ADD FIELD</span> productos.descuento <span class="kw">DEFAULT</span> <span class="num">0</span>, productos.destacado <span class="kw">DEFAULT</span> <span class="bool">false</span>\n' +
                    '\n' +
                    '<span class="kw">DROP FIELD</span> productos.descuento\n' +
                    '<span class="kw">DROP FIELD</span> productos.sku_legacy <span class="kw">WHERE</span> categoria = <span class="str">"discontinuado"</span>\n' +
                    '\n' +
                    '<span class="kw">TRUNCATE</span> productos\n' +
                    '\n' +
                    '<span class="kw">UPSERT</span> productos kb001 <span class="kw">SET</span> nombre = <span class="str">"Teclado Mecánico"</span>, precio = <span class="num">55</span>\n' +
                    '<span class="kw">UPSERT</span> productos kb001 {<span class="str">"nombre"</span>: <span class="str">"Teclado Mecánico"</span>, <span class="str">"precio"</span>: <span class="num">55</span>}'
                ) +
                tip('Utilice <span class="inline-code">UPSERT</span> para evitar verificar la existencia por separado.')
            );

            // ================================================================
            //  9. AGREGACIONES
            // ================================================================
            addSection('aggregations', 'Agregaciones (COUNT / SUM / AVG / ...)',
                '<p class="section-desc">Agregados estadísticos sobre campos numéricos y no numéricos.</p>' +
                code(
                    '<span class="kw">COUNT</span>  <span class="var">&lt;bloque&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">SUM</span>    <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">AVG</span>    <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">MIN</span>    <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">MAX</span>    <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">MEDIAN</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">MODE</span>   <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]\n' +
                    '<span class="kw">STDDEV</span> <span class="var">&lt;bloque&gt;</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">COUNT</span> productos <span class="kw">WHERE</span> en_stock = <span class="bool">true</span>\n' +
                    '<span class="kw">SUM</span> pedidos monto <span class="kw">WHERE</span> estado = <span class="str">"completado"</span>\n' +
                    '<span class="kw">AVG</span> productos precio <span class="kw">WHERE</span> categoria = <span class="str">"electrónica"</span>\n' +
                    '<span class="kw">MIN</span> productos precio\n' +
                    '<span class="kw">MAX</span> productos precio\n' +
                    '<span class="kw">MEDIAN</span> salarios monto\n' +
                    '<span class="kw">MODE</span> productos categoria\n' +
                    '<span class="kw">STDDEV</span> puntuaciones valor'
                ) +
                tip('Las agregaciones se calculan de manera eficiente utilizando índices cuando están disponibles.')
            );

            // ================================================================
            //  10. GROUP BY
            // ================================================================
            addSection('group-by', 'GROUP BY',
                '<p class="section-desc">Agrupar documentos por valores de campo y calcular agregados por grupo.</p>' +
                code(
                    '<span class="kw">GROUP</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">BY</span> <span class="var">&lt;campo&gt;</span> [<span class="kw">COUNT</span> | <span class="kw">SUM</span> | <span class="kw">AVG</span> | <span class="kw">MIN</span> | <span class="kw">MAX</span>] [<span class="var">&lt;campo&gt;</span>] [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">GROUP</span> usuarios <span class="kw">BY</span> ciudad <span class="kw">COUNT</span>\n' +
                    '<span class="kw">GROUP</span> pedidos <span class="kw">BY</span> estado <span class="kw">SUM</span> monto\n' +
                    '<span class="kw">GROUP</span> productos <span class="kw">BY</span> categoria <span class="kw">AVG</span> precio <span class="kw">WHERE</span> precio > <span class="num">10</span>\n' +
                    '<span class="kw">GROUP</span> registros <span class="kw">BY</span> nivel <span class="kw">COUNT</span> <span class="kw">WHERE</span> timestamp > <span class="str">"2024-01-01"</span>'
                ) +
                tip('Utilice GROUP BY para informes tipo dashboard y resúmenes de datos.')
            );

            // ================================================================
            //  11. TRANSACCIONES ACID
            // ================================================================
            addSection('transactions', 'Transacciones ACID',
                '<p class="section-desc">Transacciones compatibles con ACID con soporte para BEGIN, COMMIT y ROLLBACK.</p>' +
                code(
                    '<span class="kw">BEGIN</span> [<span class="var">&lt;db&gt;</span> <span class="var">&lt;bloque&gt;</span>]\n' +
                    '          <span class="var">&lt;declaraciones INSERT|UPDATE|DELETE...&gt;</span>\n' +
                    '<span class="kw">COMMIT</span>\n' +
                    '<span class="kw">ROLLBACK</span> | <span class="kw">ABORT</span>\n' +
                    '\n' +
                    '<span class="kw">TX STATUS</span>       <span class="cmt">-- Mostrar detalles de la transacción actual</span>\n' +
                    '<span class="kw">TX LIST</span>         <span class="cmt">-- Listar transacciones activas</span>\n' +
                    '<span class="kw">TX ISOLATION</span>    <span class="cmt">-- Mostrar nivel de aislamiento</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">BEGIN</span> tienda productos\n' +
                    '          <span class="kw">INSERT</span> productos {<span class="str">"nombre"</span>: <span class="str">"Cámara Web"</span>, <span class="str">"precio"</span>: <span class="num">39.90</span>}\n' +
                    '          <span class="kw">UPDATE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"kb001"</span> <span class="kw">SET</span> precio = <span class="num">45</span>\n' +
                    '          <span class="kw">DELETE</span> productos <span class="kw">WHERE</span> _id = <span class="str">"old001"</span>\n' +
                    '<span class="kw">COMMIT</span>\n' +
                    '\n' +
                    '<span class="kw">BEGIN</span> tienda productos\n' +
                    '          <span class="kw">INSERT</span> productos {<span class="str">"nombre"</span>: <span class="str">"Mala idea"</span>}\n' +
                    '<span class="kw">ROLLBACK</span>'
                ) +
                '<h4>Niveles de Aislamiento</h4>' +
                '<ul>' +
                '<li><span class="inline-code">read_committed</span> — lee solo datos confirmados.</li>' +
                '<li><span class="inline-code">repeatable_read</span> (predeterminado) — instantánea consistente durante la transacción.</li>' +
                '<li><span class="inline-code">serializable</span> — el aislamiento más fuerte, serializabilidad total.</li>' +
                '</ul>' +
                tip('Utilice transacciones para operaciones que deben ser atómicas en múltiples documentos.') +
                warning('Las transacciones de larga duración pueden bloquear otras operaciones — manténgalas cortas.')
            );

            // ================================================================
            //  12. CARGA MASIVA (BULK)
            // ================================================================
            addSection('bulk-loading', 'Carga Masiva (BULK)',
                '<p class="section-desc">Carga de alto rendimiento con agrupación optimizada y políticas de durabilidad relajadas.</p>' +
                code(
                    '<span class="kw">BULK MODE ON</span>            <span class="cmt">-- Ventanas de lote más amplias, política fsync WAL relajada</span>\n' +
                    '<span class="kw">BULK MODE OFF</span>           <span class="cmt">-- Restaurar política de agrupación/fsync normal</span>\n' +
                    '<span class="kw">BULK STATUS</span>             <span class="cmt">-- Mostrar estadísticas del motor turbo</span>\n' +
                    '\n' +
                    '<span class="kw">IMPORT</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">FROM FILE</span> <span class="str">\'&lt;ruta&gt;\'</span> [<span class="kw">FORMAT</span> <span class="kw">NDJSON</span>|<span class="kw">ARRAY</span>] [<span class="kw">BATCH</span> <span class="var">&lt;n&gt;</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">BULK MODE ON</span>\n' +
                    '<span class="kw">INSERT</span> productos <span class="kw">GENERATE</span> <span class="num">2000000</span>\n' +
                    '<span class="kw">BULK MODE OFF</span>\n' +
                    '\n' +
                    '<span class="kw">IMPORT</span> productos <span class="kw">FROM FILE</span> <span class="str">\'/data/productos.ndjson\'</span> <span class="kw">FORMAT</span> <span class="kw">NDJSON</span> <span class="kw">BATCH</span> <span class="num">50000</span>\n' +
                    '<span class="kw">IMPORT</span> productos <span class="kw">FROM FILE</span> <span class="str">\'/data/productos.json.gz\'</span> <span class="kw">FORMAT</span> <span class="kw">ARRAY</span>\n' +
                    '<span class="kw">BULK STATUS</span>'
                ) +
                tip('Utilice <span class="inline-code">BULK MODE</span> para migraciones de datos grandes y operaciones de siembra.') +
                note('El indexado FLEX-COLUMN se omite durante el MODO BULK — ejecute FLEX REINDEX después.')
            );

            // ================================================================
            //  13. JOIN
            // ================================================================
            addSection('join', 'JOIN',
                '<p class="section-desc">Unir dos bloques en una condición de igualdad de campo.</p>' +
                code(
                    '<span class="kw">JOIN</span> <span class="var">&lt;bloque1&gt;</span> <span class="kw">WITH</span> <span class="var">&lt;bloque2&gt;</span> <span class="kw">ON</span> <span class="var">&lt;bloque1&gt;</span>.<span class="var">&lt;campo&gt;</span> = <span class="var">&lt;bloque2&gt;</span>.<span class="var">&lt;campo&gt;</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">JOIN</span> pedidos <span class="kw">WITH</span> clientes <span class="kw">ON</span> pedidos.cliente_id = clientes._id\n' +
                    '<span class="kw">JOIN</span> publicaciones <span class="kw">WITH</span> usuarios <span class="kw">ON</span> publicaciones.autor_id = usuarios._id'
                ) +
                tip('Para uniones repetidas, considere usar <span class="inline-code">RELATE</span> para definir una relación permanente.')
            );

            // ================================================================
            //  14. RELATE
            // ================================================================
            addSection('relate', 'RELATE',
                '<p class="section-desc">Registrar relaciones permanentes entre bloques, permitiendo la resolución automática en consultas FIND.</p>' +
                code(
                    '<span class="kw">RELATE</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">USE</span> <span class="var">&lt;destino1&gt;</span>[,<span class="var">&lt;destino2&gt;</span>,...]'
                ) +
                '<p>Cada destino es un nombre de bloque (misma base de datos) o <span class="inline-code">db.bloque</span> para relaciones entre bases de datos. El documento fuente debe tener un campo <span class="inline-code">&lt;destino&gt;_id</span> que contenga el ID del documento destino.</p>' +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">RELATE</span> peliculas <span class="kw">USE</span> directores,actores,generos\n' +
                    '<span class="kw">RELATE</span> ventas <span class="kw">USE</span> crm.clientes,inventario.productos,contabilidad.facturas\n' +
                    '\n' +
                    '<span class="kw">FIND</span> peliculas <span class="kw">SELECT</span> titulo,directores.nombre,actores.nombre\n' +
                    '<span class="kw">FIND</span> ventas <span class="kw">SELECT</span> clientes.nombre,productos.nombre,facturas.total'
                ) +
                tip('RELATE elimina la necesidad de repetir condiciones JOIN en cada consulta.') +
                note('RELATE es explícito y permanente — a diferencia de AUTORELATIONS que son temporales.')
            );

            // ================================================================
            //  15. AUTORELATIONS
            // ================================================================
            addSection('autorelations', 'AUTORELATIONS',
                '<p class="section-desc">Relaciones automáticas y temporales basadas en patrones de acceso de lectura.</p>' +
                '<p>CaimanDB monitorea el acceso de lectura: cuando el mismo usuario lee el mismo documento repetidamente en un período corto (predeterminado: 5 lecturas en 10 minutos), crea automáticamente una autorrelación. Cada autorrelación lleva <span class="inline-code">access_count</span>, <span class="inline-code">last_seen</span>, una puntuación de <span class="inline-code">relevance</span> y <span class="inline-code">key_metadata</span>.</p>' +
                code(
                    '<span class="kw">SHOW AUTORELATIONS</span> <span class="var">&lt;bloque&gt;</span>\n' +
                    '            [<span class="kw">FROM</span> <span class="var">&lt;id&gt;</span>] [<span class="kw">TO</span> <span class="var">&lt;id&gt;</span>] [<span class="kw">DEPTH</span> <span class="var">&lt;n&gt;</span>] [<span class="kw">DIRECTION</span> <span class="kw">IN</span>|<span class="kw">OUT</span>|<span class="kw">BOTH</span>]\n' +
                    '            [<span class="kw">FORMAT</span> <span class="kw">TABLE</span>|<span class="kw">TREE</span>|<span class="kw">GRAPH</span>|<span class="kw">JSON</span>]\n' +
                    '            [<span class="kw">WHERE</span>|<span class="kw">FILTER</span> <span class="var">&lt;expresión&gt;</span>]\n' +
                    '            [<span class="kw">ORDER BY</span> <span class="kw">DEGREE</span>|<span class="kw">ID</span>|<span class="kw">NAME</span>|<span class="kw">ACCESS_COUNT</span>|<span class="kw">RELEVANCE</span>|<span class="kw">LAST_SEEN</span>|<span class="kw">FIRST_SEEN</span> [<span class="kw">ASC</span>|<span class="kw">DESC</span>]]\n' +
                    '            [<span class="kw">LIMIT</span> <span class="var">&lt;n&gt;</span>] [<span class="kw">OFFSET</span> <span class="var">&lt;n&gt;</span>]\n' +
                    '            [<span class="kw">STATS</span>] [<span class="kw">PATHS</span>] [<span class="kw">ORPHANS</span>] [<span class="kw">CYCLES</span>] [<span class="kw">BROKEN</span>] [<span class="kw">SUMMARY</span>] [<span class="kw">VERBOSE</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">SHOW AUTORELATIONS</span> productos\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">FROM</span> p_042\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">FROM</span> p_042 <span class="kw">DEPTH</span> <span class="num">3</span> <span class="kw">DIRECTION</span> <span class="kw">BOTH</span> <span class="kw">FORMAT</span> <span class="kw">TREE</span>\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">STATS</span>\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">WHERE</span> access_count > <span class="num">10</span> <span class="kw">ORDER BY</span> <span class="kw">DEGREE</span> <span class="kw">LIMIT</span> <span class="num">20</span>\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">CYCLES</span>\n' +
                    '<span class="kw">SHOW AUTORELATIONS</span> productos <span class="kw">BROKEN</span>'
                ) +
                note('Las autorrelaciones son temporales — expiran después de un TTL (predeterminado 24h) y se eliminan automáticamente.')
            );

            // ================================================================
            //  16. VISTAS
            // ================================================================
            addSection('views', 'Vistas',
                '<p class="section-desc">Crear y gestionar vistas con nombre — consultas FIND guardadas que se pueden ejecutar como bloques.</p>' +
                code(
                    '<span class="kw">VIEW CREATE</span> <span class="var">&lt;nombre&gt;</span> <span class="kw">AS FIND</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>\n' +
                    '<span class="kw">VIEW DROP</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">VIEW SHOW</span>\n' +
                    '<span class="kw">VIEW INFO</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="var">&lt;nombre_vista&gt;</span>                    <span class="cmt">-- ejecuta la vista</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">VIEW CREATE</span> usuarios_activos <span class="kw">AS FIND</span> usuarios <span class="kw">WHERE</span> activo = <span class="bool">true</span>\n' +
                    '<span class="kw">VIEW SHOW</span>\n' +
                    '<span class="kw">VIEW INFO</span> usuarios_activos\n' +
                    'usuarios_activos\n' +
                    '<span class="kw">VIEW DROP</span> usuarios_activos'
                ) +
                tip('Las vistas son ideales para consultas utilizadas con frecuencia y para informes.')
            );

            // ================================================================
            //  17. EXPORT / IMPORT
            // ================================================================
            addSection('export-import', 'EXPORT / IMPORT',
                '<p class="section-desc">Exportar documentos a archivos CSV y JSON, e importarlos de vuelta.</p>' +
                '<p><span class="inline-code">EXPORT</span> escribe archivos CSV y JSON en <span class="inline-code">&lt;data_root&gt;/backups/</span>. Cada documento exportado incluye tanto <span class="inline-code">_id</span> como <span class="inline-code">id</span>.</p>' +
                code(
                    '<span class="kw">EXPORT</span> <span class="var">&lt;bloque&gt;</span> [<span class="kw">WHERE</span> <span class="var">&lt;condición&gt;</span>] <span class="kw">TO</span> <span class="str">"&lt;archivo&gt;"</span>\n' +
                    '<span class="kw">IMPORT</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">FROM</span> <span class="str">"&lt;archivo.json&gt;"</span>        <span class="cmt">-- también busca dentro de backups/</span>\n' +
                    '<span class="kw">IMPORT</span> <span class="var">&lt;bloque&gt;</span> <span class="kw">FROM</span> <span class="str">"&lt;archivo.csv&gt;"</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">EXPORT</span> productos <span class="kw">TO</span> <span class="str">"productos_export"</span>\n' +
                    '<span class="cmt">-- escribe backups/productos_export.csv y backups/productos_export.json</span>\n' +
                    '<span class="kw">EXPORT</span> productos <span class="kw">WHERE</span> precio > <span class="num">18</span> <span class="kw">TO</span> <span class="str">"productos_caros"</span>\n' +
                    '\n' +
                    '<span class="kw">IMPORT</span> productos <span class="kw">FROM</span> <span class="str">"productos_export.json"</span>\n' +
                    '<span class="kw">IMPORT</span> productos <span class="kw">FROM</span> <span class="str">"productos_export.csv"</span>'
                ) +
                tip('Utilice EXPORT para copias de seguridad, migración de datos o intercambio de datos con otros sistemas.')
            );

            // ================================================================
            //  18. GESTIÓN DE USUARIOS
            // ================================================================
            addSection('user-management', 'Gestión de Usuarios',
                '<p class="section-desc">Crear, gestionar y eliminar usuarios de la base de datos con control de acceso basado en roles.</p>' +
                code(
                    '<span class="kw">CREATE USER</span> <span class="var">&lt;nombre&gt;</span> <span class="kw">IDENTIFIED BY</span> <span class="str">"&lt;contraseña&gt;"</span>\n' +
                    '            [<span class="kw">ROLE</span> <span class="kw">ADMIN</span>|<span class="kw">SUBADMIN</span>|<span class="kw">DEVELOPER</span>|<span class="kw">USER</span>]\n' +
                    '            [<span class="kw">STATUS</span> <span class="kw">ACTIVE</span>|<span class="kw">DISABLED</span>]\n' +
                    '            [<span class="kw">DEFAULT DATABASE</span> <span class="var">&lt;db&gt;</span>]\n' +
                    '            [<span class="kw">DEFAULT BLOCK</span> <span class="var">&lt;bloque&gt;</span>]\n' +
                    '            [<span class="kw">PASSWORD EXPIRE</span> <span class="kw">NEVER</span>|<span class="kw">DAYS</span> <span class="var">&lt;n&gt;</span>]\n' +
                    '            [<span class="kw">ACCOUNT LOCK</span> <span class="kw">ON</span>|<span class="kw">OFF</span>]\n' +
                    '            [<span class="kw">COMMENT</span> <span class="str">"&lt;descripción&gt;"</span>]\n' +
                    '<span class="kw">DROP USER</span> <span class="var">&lt;nombre&gt;</span>\n' +
                    '<span class="kw">SHOW USERS</span>\n' +
                    '\n' +
                    '<span class="kw">CREATE SERVER</span> <span class="var">&lt;nombre&gt;</span> <span class="kw">ADMIN</span> [<span class="var">&lt;nombre_usuario&gt;</span>] <span class="kw">IDENTIFIED BY</span> <span class="str">"&lt;contraseña&gt;"</span>'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">CREATE USER</span> analista <span class="kw">IDENTIFIED BY</span> <span class="str">"s3cret!"</span> <span class="kw">ROLE</span> readonly\n' +
                    '<span class="kw">CREATE USER</span> carla <span class="kw">IDENTIFIED BY</span> <span class="str">"anotherPass!"</span> <span class="kw">ROLE</span> <span class="kw">DEVELOPER</span>\n' +
                    '            <span class="kw">DEFAULT DATABASE</span> tienda <span class="kw">DEFAULT BLOCK</span> productos\n' +
                    '            <span class="kw">PASSWORD EXPIRE</span> <span class="kw">DAYS</span> <span class="num">90</span>\n' +
                    '<span class="kw">SHOW USERS</span>\n' +
                    '<span class="kw">DROP USER</span> analista'
                ) +
                note('CREATE SERVER crea una instancia de servidor aislada con sus propias credenciales de administrador.')
            );

            // ================================================================
            //  19. CONTROL DE ACCESO
            // ================================================================
            addSection('access-control', 'Control de Acceso (GRANT / REVOKE)',
                '<p class="section-desc">Conceder y revocar permisos de lectura/escritura en bases de datos y bloques.</p>' +
                code(
                    '<span class="kw">GRANT</span> <span class="var">read</span>[,<span class="var">write</span>] <span class="kw">ON</span> <span class="var">&lt;db&gt;</span>.<span class="var">&lt;bloque&gt;</span> <span class="kw">TO</span> <span class="var">&lt;usuario&gt;</span>\n' +
                    '<span class="kw">REVOKE</span> <span class="var">read</span>[,<span class="var">write</span>] <span class="kw">ON</span> <span class="var">&lt;db&gt;</span>.<span class="var">&lt;bloque&gt;</span> <span class="kw">FROM</span> <span class="var">&lt;usuario&gt;</span>\n' +
                    '<span class="kw">SHOW GRANTS</span> [<span class="kw">FOR</span> <span class="var">&lt;usuario&gt;</span>]'
                ) +
                '<h4>Ejemplos</h4>' +
                code(
                    '<span class="kw">GRANT</span> read <span class="kw">ON</span> tienda.productos <span class="kw">TO</span> analista\n' +
                    '<span class="kw">GRANT</span> read,write <span class="kw">ON</span> tienda.* <span class="kw">TO</span> carla        <span class="cmt">-- todos los bloques en tienda</span>\n' +
