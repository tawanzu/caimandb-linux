            // ================================================================
            //  RENDERIZADO
            // ================================================================
            var sidebarNav = document.getElementById('indexContainer');
            var mainContent = document.getElementById('mainContent');
            var searchInput = document.getElementById('searchInput');
            var searchMsg = document.getElementById('search-message');

            function renderAll(filter) {
                filter = filter || '';
                var filterLower = filter.toLowerCase().trim();
                var ul = document.createElement('ul');
                var visibleCount = 0;

                for (var i = 0; i < sections.length; i++) {
                    var sec = sections[i];
                    var matches = filterLower === '' ||
                        sec.title.toLowerCase().indexOf(filterLower) !== -1 ||
                        sec.content.toLowerCase().indexOf(filterLower) !== -1;

                    if (filterLower !== '' && !matches) continue;
                    visibleCount++;

                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = '#' + sec.id;
                    a.innerHTML = '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span> ' + sec.title;
                    a.dataset.id = sec.id;
                    li.appendChild(a);
                    ul.appendChild(li);
                }

                sidebarNav.innerHTML = '';
                sidebarNav.appendChild(ul);

                searchMsg.style.display = (filterLower !== '' && visibleCount === 0) ? 'block' : 'none';

                var html = '';
                for (var i = 0; i < sections.length; i++) {
                    var sec = sections[i];
                    var match = filterLower === '' ||
                        sec.title.toLowerCase().indexOf(filterLower) !== -1 ||
                        sec.content.toLowerCase().indexOf(filterLower) !== -1;
                    if (filterLower !== '' && !match) continue;
                    html += '<h2 id="' + sec.id + '">' + String(i + 1).padStart(2, '0') + '. ' + sec.title + '</h2>' + sec.content;
                }
                mainContent.innerHTML = html;

                var links = sidebarNav.querySelectorAll('a');
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var id = entry.target.id;
                            links.forEach(function(a) {
                                if (a.dataset.id === id) {
                                    a.classList.add('active');
                                } else {
                                    a.classList.remove('active');
                                }
                            });
                        }
                    });
                }, { threshold: 0.25 });

                document.querySelectorAll('.main-content h2').forEach(function(h) { observer.observe(h); });
            }

            renderAll('');

            searchInput.addEventListener('input', function() {
                renderAll(this.value);
            });

            document.addEventListener('click', function(e) {
                var link = e.target.closest('a[href^="#"]');
                if (link) {
                    e.preventDefault();
                    var targetId = link.getAttribute('href').substring(1);
                    var targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth' });
                        document.querySelectorAll('.index-container a').forEach(function(a) {
                            if (a.dataset.id === targetId) {
                                a.classList.add('active');
                            } else {
                                a.classList.remove('active');
                            }
                        });
                    }
                }
            });

        })();
    </script>
